name: release

# A pushed vX.Y.Z tag builds that commit and publishes a GitHub Release with the plugin and operations jars.
# For a tag that existed before this workflow, run it by hand (Actions > release > Run workflow) with the tag name.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release를 만들 기존 태그 (예: v1.4.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      # checkout can leave an annotated tag without its message; fetch the tags again for the release notes.
      - run: git fetch --force --tags origin
      - name: Check the tag matches the plugin version
        run: |
          version=$(tr -d '\r' < build.gradle | sed -n "s/^version = '\(.*\)'$/\1/p")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match build.gradle version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test build --console=plain
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="build/libs/LIMPI-$VERSION.jar build/libs/LIMPI-operations-$VERSION.jar"
          ls -l $files
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Already published (e.g. re-run): replace the jars, keep the text.
            gh release upload "$TAG" $files --clobber
          else
            notes=$(git tag -l --format='%(contents)' "$TAG")
            gh release create "$TAG" $files --verify-tag --notes "${notes:-LIMPI $VERSION}"
          fi
