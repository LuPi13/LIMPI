plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm'
    id 'com.gradleup.shadow' version '9.2.2'
}

group = 'com.github.lupi13'
version = '1.0.0'

repositories {
    mavenCentral()
    maven {
        name = "papermc"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.3.build.169-beta'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:${kotlin.coreLibrariesVersion}"
    implementation "org.jetbrains.kotlin:kotlin-reflect:${kotlin.coreLibrariesVersion}"
    implementation 'fr.skytasul:guardianbeam:2.4.8'
    implementation('org.xerial:sqlite-jdbc:3.53.4.0') {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
    testImplementation 'io.papermc.paper:paper-api:26.3.build.169-beta'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def targetJavaVersion = 25
java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    options.release.set(targetJavaVersion)
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
kotlin {
    jvmToolchain(targetJavaVersion)
}
shadowJar {
    archiveFileName = 'LIMPI-'+version+'.jar'
    destinationDirectory = layout.buildDirectory.dir('libs')
}
tasks.named('jar') {
    archiveClassifier = 'plain'
}
tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}
tasks.named('test') {
    useJUnitPlatform()
}
