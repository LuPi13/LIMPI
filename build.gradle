plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm'
    id 'com.gradleup.shadow' version '9.2.2'
}

group = 'com.github.lupi13'
version = '2.6.0'

repositories {
    mavenCentral()
    maven {
        name = "papermc"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

configurations { operationsRuntime }

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.3.build.169-beta'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:${kotlin.coreLibrariesVersion}"
    implementation 'fr.skytasul:guardianbeam:2.4.8'
    implementation('net.kyori:adventure-nbt:5.2.0') { transitive = false }
    implementation('org.xerial:sqlite-jdbc:3.53.4.0') {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
    testImplementation 'io.papermc.paper:paper-api:26.3.build.169-beta'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    operationsRuntime "org.jetbrains.kotlin:kotlin-stdlib:${kotlin.coreLibrariesVersion}"
    operationsRuntime 'org.xerial:sqlite-jdbc:3.53.4.0'
    operationsRuntime 'org.yaml:snakeyaml:2.2'
}

def targetJavaVersion = 25
java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    options.release.set(targetJavaVersion)
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
kotlin {
    jvmToolchain(targetJavaVersion)
}
shadowJar {
    relocate 'net.kyori.adventure.nbt', 'com.github.lupi13.limpi.internal.nbt'
    archiveFileName = 'LIMPI-'+version+'.jar'
    destinationDirectory = layout.buildDirectory.dir('libs')
}
tasks.named('jar') {
    archiveClassifier = 'plain'
}
tasks.named('build') {
    dependsOn tasks.named('shadowJar')
    dependsOn tasks.named('operationsJar')
}
tasks.register('operationsJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    dependsOn tasks.named('classes')
    archiveFileName = 'LIMPI-operations-'+version+'.jar'
    destinationDirectory = layout.buildDirectory.dir('libs')
    configurations = [project.configurations.operationsRuntime]
    from(sourceSets.main.output.classesDirs) {
        include 'com/github/lupi13/limpi/ops/**'
        include 'com/github/lupi13/limpi/storage/SqliteStateStore*'
        include 'com/github/lupi13/limpi/storage/StateStore*'
        include 'com/github/lupi13/limpi/storage/StateTransaction*'
        include 'com/github/lupi13/limpi/storage/LedgerEntry*'
        include 'com/github/lupi13/limpi/storage/CommittedTransaction*'
        include 'com/github/lupi13/limpi/storage/TransactionIdentityConflict*'
    }
    manifest { attributes 'Main-Class': 'com.github.lupi13.limpi.ops.OperationsCli' }
}
tasks.named('test') {
    useJUnitPlatform()
}
