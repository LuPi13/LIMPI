HelpUrl: 'https://lupi13.github.io/LIMPI/'  # /ability help, /financial help에 표시할 웹 도움말 주소. 비워 두면 링크를 표시하지 않음

#=== Financial System Configuration ===#
EnableFinancialSystem: true  # 금융 시스템 활성화 여부
PlayerDataDirectory: ''  # 비어 있으면 자동 탐지(26.1+: <월드>/players/data). 별도 저장 환경에서는 서버 worldContainer 기준 경로 또는 절대 경로
InitialMoney: 1000  # 첫 소지금
DeathMoneyLossPercent: 50  # 사망 시 계좌 잔액 중 수표로 죽은 자리에 떨어뜨릴 비율(%), 0~100 정수. 원 단위 내림. 0이면 잃지 않고 메시지도 없음
SellRecoveryHours: 12  # 많이 팔수록 내려가는 판매가(financial/sellPrice.yml)에서, 플레이어별 누적 판매 개수가 절반으로 회복되는 시간(시간), 1 이상의 정수
StockVolatility: 0.025  # 주식 1회 변동의 표준 편차(로그 가격 기준, 0.025 ≈ ±2.5%), 0 이상
StockReversion: 0.005  # 주식 가격 회귀율(0~1). 매 변동마다 기준 가격과의 차이(로그)를 이 비율만큼 줄임(기본값이면 차이가 반으로 주는 데 약 139회). 기본값이면 가격은 대부분 기준 가격의 0.5~1.5배 사이
StockFeePercent: 3  # 주식 매수·매도 수수료(%), 0~100 정수. 거래 금액에서 원 단위 내림
StockInterval: 10  # 주식 변동 주기(분), 양수. 재시작 후 누락 구간은 현재 시간 경계에서 1회 갱신
RecordRetentionDays: 7  # 서버 시작 시 이 일수가 지난 완료된 지급/회수/능력 전환/장터 등록 기록과 거래 장부를 정리 (0 이하면 정리 안 함)
BackupIntervalMinutes: 60  # 서버 시작 시와 이 주기(분)마다 DB 비동기 백업. 0이면 시작 백업도 끔
BackupKeep: 24  # 성공한 자동 백업 중 최근 보관 개수(양수)
DebugTransactionTiming: false  # execute/atomic 전체 수행 시간 로그. 켜면 50ms 이상은 경고, 나머지는 정보 로그
#=== Financial System Configuration End ===#

#=== Ability System Configuration ===#
EnableAbilitySystem: true  # 능력 시스템 활성화 여부
PickUpChange: 30  # 픽업 능력 변경 주기 (분), 60의 약수 또는 90, 120같이 1시간과 관련있는 수 권장
PickUpSpoiler: 3  # /ability pickup 명령어로 볼 수 있는 픽업 능력 개수
InitialTicket: 10  # 첫 뽑기권 수
InitialCOMMON: 1  # 첫 COMMON 선택권 수
InitialRARE: 1  # 첫 RARE 선택권 수
InitialEPIC: 1  # 첫 EPIC 선택권 수

LEGENDARYProbability:  # LEGENDARY 등급 등장 확률
  Base: 0.005  # 기본 뽑기 확률
  Increment: 0.05  # 뽑기 확률 증가량
  IncreaseCount: 81  # 위의 증가량이 적용되기 시작하는 횟수
  PickUp: 0.5  # LEGENDARY 픽업 능력 확률
  SemiCeiling: 1  # 이 값만큼의 픽업이 아닌 능력을 뽑으면, 다음 LEGENDARY 능력은 픽업 능력으로 고정됨

EPICProbability:  # EPIC 등급 등장 확률
  Base: 0.03  # 기본 뽑기 확률
  Increment: 0.3  # 뽑기 확률 증가량
  IncreaseCount: 7  # 위의 증가량이 적용되기 시작하는 횟수
  PickUp: 0.5  # EPIC 픽업 능력 확률
  SemiCeiling: 1  # 이 값만큼의 픽업이 아닌 능력을 뽑으면, 다음 EPIC 능력은 픽업 능력으로 고정됨

TROLLProbability: 0.01  # LEGENDARY, EPIC이 등장하지 않았을 때, TROLL 등급 등장 확률
ForceTroll: true  # TROLL 능력이 뽑기에서 등장 시 강제 적용 여부

RAREProbability: 0.3  # LEGENDARY, EPIC, TROLL이 등장하지 않았을 때, RARE 등급 등장 확률

TicketMoneyPrice: 2000  # 뽑기권 가격(원)
SelectMoneyPrice:  # 능력 선택권 가격(원). TROLL 선택권은 팔지 않음
  COMMON: 1500
  RARE: 2000
  EPIC: 3000
  LEGENDARY: 4000
  MYTHIC: 5000

#=== Chest System Configuration ===#
EnableChestSystem: true  # 상자 시스템 활성화 여부. 꺼도 이미 해금한 상자는 /chest로 열 수 있음(구매·자동 저장·사망 시 떨어뜨림은 중지)
ChestUnlockPrice: 10000  # 상자 해금(1줄, 9칸) 가격
ChestUpgradePrice: [20000, 40000, 80000, 160000, 320000]  # 2줄, 3줄, 4줄, 5줄, 6줄로 늘리는 가격(5개)
ChestAutoStorePrice: 50000  # 자동 저장 가격
ChestEnderPrice: 1000000  # 엔더화(죽어도 상자 아이템을 떨어뜨리지 않음) 가격
#=== Chest System Configuration End ===#

#=== Estate System Configuration ===#
EnableEstateSystem: true  # 사유지 시스템 활성화 여부. 꺼도 이미 산 사유지의 보호·조회·매각·공유와 관리자 명령은 동작(새 구매만 중지). 구매는 금융 시스템도 필요
EstatePricePerBlock: 4  # 사유지 블록 1칸당 구매 가격(원), 0 이상 정수
EstateRefundPercent: 50  # 매각 시 돌려받는 비율(구매 때 낸 금액의 %), 0~100 정수
EstateMaxWidth: 128  # 한 구역의 최대 가로(X)·세로(Z) 길이(칸), 1~1024 정수
EstateMaxHeight: 0  # 한 구역의 최대 높이(칸), 0이면 제한 없음
EstateMaxCount: 10  # 1인당 최대 사유지 개수, 0 이상 정수
EstateWorlds: []  # 사유지를 살 수 있는 월드 이름 목록(예: [world, world_nether]). 비어 있으면 모든 월드
#=== Estate System Configuration End ===#

#=== Notice Configuration ===#
NoticeRetentionDays: 30  # 서버 시작 시와 공지 등록 시 이 일수보다 오래된 공지를 삭제 (0 이하면 삭제 안 함)
#=== Notice Configuration End ===#

#=== Casino Configuration ===#
EnableCasino: true  # 카지노 활성화 여부. 금융 시스템도 켜져 있어야 함. 꺼도 서버 시작 시 중단된 공유 판의 정산·환불은 수행
CasinoMinBet: 100  # 최소 베팅(원), 1 이상 정수
CasinoMaxBet: 100000  # 최대 베팅(원). 공유 게임은 한 판의 플레이어별 합계에 적용
CasinoMaxPayout: 10000000  # 한 판 최대 지급액(원). 마인즈·크래시는 이 금액에 닿으면 자동 수령
CasinoMinesRtpPercent: 97  # 마인즈 환수율(%), 1~100 정수
CasinoCrashRtpPercent: 97  # 크래시 환수율(%), 1~100 정수
CasinoCrashGrowth: 0.08  # 크래시 배율 상승 속도(초당 로그 증가량). 0.08이면 약 8.7초에 2배
CasinoCrashMaxMultiplier: 1000  # 크래시 최대 배율, 2 이상 정수
CasinoCrashBettingSeconds: 15  # 크래시 첫 베팅 후 대기 시간(초)
CasinoRaceRtpPercent: 97  # 양 경주 환수율(%), 1~100 정수. 집이 배당하므로 플레이어끼리 돈이 오가지 않음
CasinoRaceOddsPercent: [30, 25, 18, 13, 9, 5]  # 양 6마리의 우승 확률(%). 합계 100. 경주마다 무작위로 배정
CasinoRaceBettingSeconds: 30  # 양 경주 첫 베팅 후 대기 시간(초)
CasinoBlackjackBettingSeconds: 15  # 블랙잭 2인 이상일 때 첫 베팅 후 대기 시간(초)
CasinoBlackjackTurnSeconds: 20  # 블랙잭 차례 제한(초). 넘기면 자동 Stand
CasinoSlotSymbols:  # 슬롯 심볼. weight: 등장 가중치, triple: 줄에 3개, pair: 앞 2개 같을 때 배당(줄 베팅의 배수, 줄 베팅 = 베팅액/5). 바꾸면 시작 로그의 환수율을 확인
  COAL: {weight: 34, triple: 6, pair: 1}
  IRON: {weight: 26, triple: 11, pair: 1}
  GOLD: {weight: 18, triple: 25, pair: 1}
  EMERALD: {weight: 12, triple: 60, pair: 2}
  DIAMOND: {weight: 7, triple: 200, pair: 5}
  NETHERITE: {weight: 3, triple: 500, pair: 10}
CasinoJackpotMinProfit: 100000  # 잭팟 서버 공지에 필요한 최소 수익(지급액 - 베팅액, 원). 아래 배율도 함께 넘어야 공지. 블랙잭은 공지 없음
CasinoJackpotMinesMultiplier: 50  # 마인즈 잭팟 공지 배율(지급액 ÷ 베팅액), 2 이상 정수
CasinoJackpotSlotMultiplier: 40  # 슬롯 잭팟 공지 배율, 2 이상 정수
CasinoJackpotCrashMultiplier: 50  # 크래시 잭팟 공지 배율, 2 이상 정수
CasinoJackpotRaceMultiplier: 19  # 양 경주 잭팟 공지 배율, 2 이상 정수. 지급액 ÷ 그 경주에 건 금액 합계. 기본 최고 배당은 19.40배
#=== Casino Configuration End ===#
