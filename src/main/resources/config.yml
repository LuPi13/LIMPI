HelpUrl: 'https://lupi13.github.io/LIMPI/'  # /ability help, /financial help에 표시할 웹 도움말 주소. 비워 두면 링크를 표시하지 않음

#=== Financial System Configuration ===#
EnableFinancialSystem: true  # 금융 시스템 활성화 여부
PlayerDataDirectory: ''  # 비어 있으면 자동 탐지(26.1+: <월드>/players/data). 별도 저장 환경에서는 서버 worldContainer 기준 경로 또는 절대 경로
InitialMoney: 1000  # 첫 소지금
SellRecoveryHours: 12  # 많이 팔수록 내려가는 판매가(financial/sellPrice.yml)에서, 플레이어별 누적 판매 개수가 절반으로 회복되는 시간(시간), 1 이상의 정수
StockVolatility: 0.05  # 주식 1회 변동의 표준 편차(로그 가격 기준, 0.05 ≈ ±5%), 0 이상
StockReversion: 0.02  # 주식 가격 회귀율(0~1). 매 변동마다 기준 가격과의 차이(로그)를 이 비율만큼 줄임. 기본값 0.05/0.02면 가격은 대부분 기준 가격의 0.5~1.5배 사이
StockFeePercent: 3  # 주식 매수·매도 수수료(%), 0~100 정수. 거래 금액에서 원 단위 내림
StockInterval: 10  # 주식 변동 주기(분), 양수. 재시작 후 누락 구간은 현재 시간 경계에서 1회 갱신
RecordRetentionDays: 7  # 서버 시작 시 이 일수가 지난 완료된 지급/회수/능력 전환/장터 등록 기록과 거래 장부를 정리 (0 이하면 정리 안 함)
BackupIntervalMinutes: 60  # 서버 시작 시와 이 주기(분)마다 DB 비동기 백업. 0이면 시작 백업도 끔
BackupKeep: 24  # 성공한 자동 백업 중 최근 보관 개수(양수)
DebugTransactionTiming: false  # execute/atomic 전체 수행 시간 로그. 켜면 50ms 이상은 경고, 나머지는 정보 로그
#=== Financial System Configuration End ===#

#=== Ability System Configuration ===#
EnableAbilitySystem: true  # 능력 시스템 활성화 여부
PickUpChange: 30  # 픽업 능력 변경 주기 (분), 60의 약수 또는 90, 120같이 1시간과 관련있는 수 권장
PickUpSpoiler: 3  # /ability pickup 명령어로 볼 수 있는 픽업 능력 개수
InitialTicket: 10  # 첫 뽑기권 수
InitialCOMMON: 1  # 첫 COMMON 선택권 수
InitialRARE: 1  # 첫 RARE 선택권 수
InitialEPIC: 1  # 첫 EPIC 선택권 수

LEGENDARYProbability:  # LEGENDARY 등급 등장 확률
  Base: 0.005  # 기본 뽑기 확률
  Increment: 0.05  # 뽑기 확률 증가량
  IncreaseCount: 81  # 위의 증가량이 적용되기 시작하는 횟수
  PickUp: 0.5  # LEGENDARY 픽업 능력 확률
  SemiCeiling: 1  # 이 값만큼의 픽업이 아닌 능력을 뽑으면, 다음 LEGENDARY 능력은 픽업 능력으로 고정됨

EPICProbability:  # EPIC 등급 등장 확률
  Base: 0.03  # 기본 뽑기 확률
  Increment: 0.3  # 뽑기 확률 증가량
  IncreaseCount: 7  # 위의 증가량이 적용되기 시작하는 횟수
  PickUp: 0.5  # EPIC 픽업 능력 확률
  SemiCeiling: 1  # 이 값만큼의 픽업이 아닌 능력을 뽑으면, 다음 EPIC 능력은 픽업 능력으로 고정됨

TROLLProbability: 0.01  # LEGENDARY, EPIC이 등장하지 않았을 때, TROLL 등급 등장 확률
ForceTroll: true  # TROLL 능력이 뽑기에서 등장 시 강제 적용 여부

RAREProbability: 0.3  # LEGENDARY, EPIC, TROLL이 등장하지 않았을 때, RARE 등급 등장 확률

TicketMoneyPrice: 2000  # 뽑기권 가격(원)
SelectMoneyPrice:  # 능력 선택권 가격(원). TROLL 선택권은 팔지 않음
  COMMON: 1500
  RARE: 2000
  EPIC: 3000
  LEGENDARY: 4000
  MYTHIC: 5000

#=== Chest System Configuration ===#
EnableChestSystem: true  # 상자 시스템 활성화 여부. 꺼도 이미 해금한 상자는 /chest로 열 수 있음(구매·자동 저장·사망 시 떨어뜨림은 중지)
ChestUnlockPrice: 10000  # 상자 해금(1줄, 9칸) 가격
ChestUpgradePrice: [20000, 40000, 80000, 160000, 320000]  # 2줄, 3줄, 4줄, 5줄, 6줄로 늘리는 가격(5개)
ChestAutoStorePrice: 50000  # 자동 저장 가격
ChestEnderPrice: 1000000  # 엔더화(죽어도 상자 아이템을 떨어뜨리지 않음) 가격
#=== Chest System Configuration End ===#

#=== Notice Configuration ===#
NoticeRetentionDays: 30  # 서버 시작 시와 공지 등록 시 이 일수보다 오래된 공지를 삭제 (0 이하면 삭제 안 함)
#=== Notice Configuration End ===#
