# 서버 판매 가격(원). 여기에 없는 아이템은 0원(판매창에 넣으면 사라짐).
# 기준: 직접 플레이 시급 약 10,000원(다이아 수동 채굴 약 50개/시간).
#
# 쓰는 법
#   아이템: 가격                 고정 가격
#   아이템: {price, half, floor} 사람별로 많이 팔수록 감소
#       n번째(0부터) 판매가 = max(floor, price × 0.5^(n / half)), 한 번 판매한 합계에서 원 단위 내림
#       누적 판매 개수는 config.yml의 SellRecoveryHours(기본 12)마다 절반으로 회복
#   아이템: {same, count}        다른 아이템 count개로 계산(압축 블록 우회 방지)
# 이 파일은 없을 때만 만들어지며, 고친 내용은 덮어쓰지 않는다.

