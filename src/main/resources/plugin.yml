name: LIMPI
version: '${version}'
main: com.github.lupi13.limpi.LIMPI
api-version: '26.3'
authors: [LuPi13]
description: "LIMPI: LuPi13's Integrated Minecraft Plug-In"
website: https://github.com/LuPi13/LIMPI
commands:
  financial:
    description: command about money, check, stock, etc.
    usage: 잘못된 사용법이거나, config.yml에서 financial 시스템이 비활성화 되어 있습니다.
    aliases: [fi, fc]

  ability:
    description: command about ability, gacha, etc.
    usage: 잘못된 사용법이거나, config.yml에서 ability 시스템이 비활성화 되어 있습니다.
    aliases: [ab]

  chest:
    description: command about the purchasable personal chest
    usage: 잘못된 사용법이거나, config.yml에서 chest 시스템이 비활성화 되어 있습니다.
    aliases: [ch]

  estate:
    description: command about buying and protecting land
    usage: 잘못된 사용법입니다. /estate help를 확인하세요.
    aliases: [es]

  notice:
    description: command about server notices
    usage: 잘못된 사용법입니다. /notice help를 확인하세요.
    aliases: ['no', nt]

  limpi:
    description: LIMPI help for every system
    usage: 잘못된 사용법입니다. /limpi help를 확인하세요.

permissions:
  limpi.notice.show:
    description: Read current and past notices
    default: true
  limpi.notice.admin.write:
    description: Write a notice and show it to online players
    default: op
  limpi.notice.admin.delete:
    description: Delete a notice
    default: op
  limpi.ability.quest:
    description: Inspect your quest completion rewards and progress
    default: true
  limpi.ability.admin.reload:
    description: Validate and reload every ability settings file
    default: op
  limpi.ability.me:
    description: Inspect your active ability
    default: true
  limpi.ability.dictionary:
    description: Open the ability dictionary
    default: true
  limpi.ability.pity:
    description: Inspect gacha probability and pity
    default: true
  limpi.ability.pickup:
    description: Inspect current and scheduled pickup abilities
    default: true
  limpi.ability.result:
    description: Inspect your saved gacha and selection results
    default: true
  limpi.financial.me:
    description: Inspect your account balance
    default: true
  limpi.financial.stock:
    description: Trade stocks and inspect holdings
    default: true
  limpi.financial.admin.spy:
    description: Inspect existing online or offline accounts
    default: op
  limpi.financial.admin.stock:
    description: Add delist restore or reset stock reference prices
    default: op
  limpi.ability.enemy:
    description: Configure ability target categories
    default: true
  limpi.ability.select:
    description: Select an unlocked ability with a matching ticket
    default: true
  limpi.ability.admin.set:
    description: Apply an ability without consuming a selection ticket
    default: op
  limpi.ability.shop:
    description: Buy ability tickets with money
    default: true
  limpi.financial.admin.catalog:
    description: Configure server shop and sale prices
    default: op
  limpi.financial.shop:
    description: Buy items from the server shop
    default: true
  limpi.financial.sell:
    description: Sell selected inventory stacks
    default: true
  limpi.financial.check:
    description: Issue and redeem server-recorded checks
    default: true
  limpi.financial.admin.check:
    description: Inspect issued check records
    default: op
  limpi.financial.market:
    description: Use the player market
    default: true
  limpi.financial.admin.market:
    description: Remove other players' market listings
    default: op
  limpi.financial.claim:
    description: Claim pending items
    default: true
  limpi.financial.send:
    description: Send money to an existing account
    default: true
  limpi.financial.admin.set:
    description: Set or repair an account balance
    default: op
  limpi.financial.admin.add:
    description: Adjust an account balance
    default: op
  limpi.chest.open:
    description: Open your purchased chest
    default: true
  limpi.chest.shop:
    description: Buy chest unlock, upgrades, auto store and ender
    default: true
  limpi.chest.auto:
    description: Toggle chest auto store
    default: true
  limpi.chest.admin.inspect:
    description: Inspect any player's chest and unresolved chest windows
    default: op
  limpi.estate.buy:
    description: Select and buy an estate
    default: true
  limpi.estate.info:
    description: List your estates, show their edges and check who owns where you stand
    default: true
  limpi.estate.sell:
    description: Sell your estate for part of its price
    default: true
  limpi.estate.trust:
    description: Let other players build in your estate
    default: true
  limpi.estate.admin.inspect:
    description: Inspect any player's estates and damaged estate records
    default: op
  limpi.estate.admin.remove:
    description: Remove any estate with an optional refund and a recorded reason
    default: op
  limpi.estate.admin.bypass:
    description: Build and use blocks in every estate
    default: op
  limpi.admin.recovery:
    description: Every /limpi recovery command
    default: op
    children:
      limpi.admin.recovery.review: true
      limpi.admin.recovery.delivery: true
      limpi.admin.recovery.removal: true
      limpi.admin.recovery.transition: true
      limpi.admin.recovery.escrow: true
      limpi.admin.recovery.chest: true
      limpi.admin.recovery.estate: true
  limpi.admin.recovery.review:
    description: List every pending recovery record with its resolve command (/limpi review)
    default: op
  limpi.admin.recovery.delivery:
    description: Inspect and resolve interrupted deliveries (/limpi delivery)
    default: op
  limpi.admin.recovery.removal:
    description: Inspect and resolve interrupted item removals (/limpi removal)
    default: op
  limpi.admin.recovery.transition:
    description: Inspect and resolve interrupted ability inventory transitions (/limpi transition)
    default: op
  limpi.admin.recovery.escrow:
    description: Inspect and resolve interrupted market escrows (/limpi escrow)
    default: op
  limpi.admin.recovery.chest:
    description: Resolve interrupted chest windows while the owner is offline (/limpi chest resolve)
    default: op
  limpi.admin.recovery.estate:
    description: Discard an estate record that cannot be read, keeping it in the ledger (/limpi estate discard)
    default: op
